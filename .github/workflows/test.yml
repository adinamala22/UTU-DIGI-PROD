name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test-only values: the suite runs against a throwaway Postgres + mock gateway.
      AUTH_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@urltuneup.com
      ADMIN_PASSWORD: ci-admin-password
      YOUPI_WEBHOOK_SECRET: ci-webhook-secret
      YOUPI_MERCHANT_ID: ci-merchant
      EMAIL_FROM: "URL Tune Up <purchase@urltuneup.com>"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  prod-smoke:
    # Read-only checks against the live site after main is updated.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: unit-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Vercel deploy
        run: sleep 120
      - run: npm run test:e2e:prod
